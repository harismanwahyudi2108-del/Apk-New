name: Build VC Ringan v6.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File Repository
        uses: actions/checkout@v4

      - name: Ekstrak ZIP Proyek APK
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Mengekstrak $f ..."
            unzip -o "$f" -x ".github/*"
          done

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setujui Lisensi Android SDK
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build File APK v6.3
        run: gradle assembleDebug --no-daemon

      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: VC-Ringan-HD-v6.3-Mandiri-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
